<script>
const form = document.getElementById('unlock-form');
const field = document.getElementById('access-code');
const message = document.getElementById('message');
const submitButton = document.getElementById('unlock');
const decode = text => Uint8Array.from(atob(text), character => character.charCodeAt(0));
form.addEventListener('submit', async event => {
  event.preventDefault();
  if (!globalThis.crypto?.subtle) {
    message.textContent = 'HTTPS 공유 링크를 브라우저에서 열어 주세요.';
    return;
  }
  form.setAttribute('aria-busy', 'true');
  submitButton.disabled = true;
  message.textContent = '코드를 확인하는 중입니다.';
  try {
    const data = JSON.parse(document.getElementById('encrypted-plan').textContent);
    const code = new TextEncoder().encode(field.value.trim());
    const passwordKey = await crypto.subtle.importKey('raw', code, 'PBKDF2', false, ['deriveKey']);
    code.fill(0);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: decode(data.salt), iterations: data.rounds, hash: 'SHA-256' },
      passwordKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    const plaintext = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: decode(data.iv) }, key, decode(data.encrypted)
    );
    const plan = new TextDecoder().decode(plaintext);
    field.value = '';
    document.open();
    document.write(plan);
    document.close();
  } catch {
    message.textContent = '코드가 맞지 않습니다. 공백이나 빠진 글자가 있는지 확인해 주세요.';
    field.select();
  } finally {
    form.removeAttribute('aria-busy');
    submitButton.disabled = false;
  }
});
</script>
